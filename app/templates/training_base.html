<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="color-scheme" content="dark" />
  <meta name="csrf-token" content="{{ request.session.get('csrf_token','') }}" />
  <title>{% block title %}Training Tracker{% endblock %}</title>
  <link rel="manifest" href="/training/manifest.json" />
  <link rel="icon" href="/training/static/icons/icon-192.png" />
  <link rel="stylesheet" href="/static/css/style.css" />
  <script src="/static/vendor/htmx.min.js" defer></script>
  <script src="/static/js/app.js" defer></script>
</head>
<body>
  <header class="app-header">
    <a class="app-brand" href="/training/">
      <span class="brand-mark">🏋️</span>
      <span>Training</span>
    </a>
    <nav class="app-nav">
      <a href="/training/" class="nav-link {{ 'active' if active_page == 'dashboard' }}">今日</a>
      <a href="/training/calendar" class="nav-link {{ 'active' if active_page == 'calendar' }}">日历</a>
      <a href="/training/stats" class="nav-link {{ 'active' if active_page == 'stats' }}">统计</a>
      <a href="/training/settings" class="nav-link {{ 'active' if active_page == 'settings' }}">设置</a>
    </nav>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  {% if message %}
  <div class="toast">{{ message }}</div>
  {% endif %}
</body>
</html>
